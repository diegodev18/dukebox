# Builds the control plane into a self-contained tarball and publishes it to a
# GitHub Release — the feed `duke update` reads. The desktop app is released
# separately (`release.yml`, tag `desktop-v*`).
#
# Trigger with:
#   git tag server-v0.1.0 && git push origin server-v0.1.0
#
# The release is created as a draft: review the assets, then publish it. Until
# then `duke update` will not offer it.
name: Release server

on:
  workflow_dispatch:
  push:
    tags:
      - 'server-v*'

permissions:
  contents: write

jobs:
  publish:
    name: Release server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '@dukebox/server...'

      - name: Build the server bundle
        run: ./scripts/package-server.sh "${GITHUB_REF_NAME#server-v}"

      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#server-v}"

          # The bundle is pure JavaScript, so one build serves every
          # architecture. Publish both names so `duke update` can select the
          # asset that matches the machine, and add the second checksum.
          x64="dist-release/dukebox-server-$version-linux-x64.tar.gz"
          arm64="dist-release/dukebox-server-$version-linux-arm64.tar.gz"
          cp "$x64" "$arm64"
          # Basename only, so `duke update` can look the asset up by its file name.
          (cd dist-release && sha256sum "dukebox-server-$version-linux-arm64.tar.gz") >> dist-release/SHA256SUMS

          gh release create "server-v$version" \
            "$x64" "$arm64" dist-release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dukebox server v$version" \
            --notes "Control plane release. Update an installed server with: sudo duke update" \
            --draft

          # The desktop app polls releases/latest/download/latest.json, which
          # follows whichever release was published last. A server release is
          # published after the desktop one, so it becomes that `latest` and
          # must carry the desktop update manifest forward or the feed 404s.
          #
          # Which manifest gets carried is the whole game: shipping an older
          # one here tells every installed app to "update" backwards. Prefer
          # the desktop release cut from this same version — it is the one
          # this server release ships alongside, and it is still a draft while
          # this job runs, so a published-only lookup would miss it and reach
          # for a stale manifest instead.
          feed_tag="desktop-v$version"
          if ! gh release view "$feed_tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq 'any(.assets[]; .name == "latest.json")' 2>/dev/null | grep -qx true; then
            # No desktop release at this version: this is a server-only
            # release, so hold the feed steady by repeating whatever manifest
            # is live right now. Newest published desktop release wins.
            feed_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '[.[] | select(.draft == false and (.tag_name | startswith("desktop-v"))
                     and any(.assets[]; .name == "latest.json"))][0].tag_name')"
          fi

          [ -n "$feed_tag" ] && [ "$feed_tag" != "null" ] || {
            echo "::error::No desktop release carries a latest.json. Publishing this" \
                 "server release would 404 the desktop update feed." >&2
            exit 1
          }

          gh release download "$feed_tag" --pattern latest.json --repo "$GITHUB_REPOSITORY"

          # Last guard: never move the feed backwards. Compare against the
          # manifest the apps are being served today; a lower version here
          # means the lookup above picked up something stale.
          carried="$(jq -r '.version' latest.json)"
          live="$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" \
            | jq -r '.version' || true)"
          if [ -n "$live" ] && [ "$live" != "null" ] \
            && [ "$(printf '%s\n%s\n' "$live" "$carried" | sort -V | tail -1)" != "$carried" ]; then
            echo "::error::Refusing to move the desktop update feed from $live back to" \
                 "$carried (source: $feed_tag)." >&2
            exit 1
          fi

          echo "Carrying desktop update manifest $carried forward from $feed_tag"
          gh release upload "server-v$version" latest.json --repo "$GITHUB_REPOSITORY"
