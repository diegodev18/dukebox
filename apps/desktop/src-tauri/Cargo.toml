[package]
name = "dukebox"
version = "0.0.0"
description = "Dukebox desktop app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dukebox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
# Requests go through the native process rather than the webview. On macOS the
# webview refuses plaintext HTTP, and a Dukebox server is reached over a tailnet
# where there is no certificate authority to satisfy — so the webview's fetch
# fails with "Load failed" and no way to fix it from the frontend.
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# The app ships as a small binary, which is the reason for using Tauri at all.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
