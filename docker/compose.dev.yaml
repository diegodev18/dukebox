# Development and integration-test dependencies.
#
# The credentials below are throwaway values for a local, disposable database.
# They are committed on purpose so `verify.sh` works from a fresh clone with no
# setup. Nothing here is used in a real installation: the installer generates
# per-machine credentials into /etc/dukebox/config.toml, which is never
# committed. Ports bind to 127.0.0.1 so this stack is unreachable from the
# network even on a shared machine.
name: dukebox-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dukebox
      POSTGRES_PASSWORD: dukebox
      POSTGRES_DB: dukebox
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dukebox -d dukebox']
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      # Dev data is disposable; keeping it in RAM makes resets instant.
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

  verify:
    build:
      context: ..
      dockerfile: docker/verify.dockerfile
    working_dir: /workspace
    volumes:
      # The repository is bind-mounted read-write so host edits apply
      # immediately. Every directory holding generated content is then masked
      # by a container-only volume, keeping node_modules and build output —
      # Linux binaries, useless on macOS — off the host's filesystem.
      #
      # This list must cover every workspace package. `docker/check-mounts.sh`
      # fails the build if one is missing, so a new package cannot silently
      # start writing to the host.
      - ../:/workspace
      - dukebox-node-modules:/workspace/node_modules
      - dukebox-pnpm-store:/pnpm-store
      - dukebox-turbo-cache:/workspace/.turbo

      - dukebox-nm-protocol:/workspace/packages/protocol/node_modules
      - dukebox-dist-protocol:/workspace/packages/protocol/dist
      - dukebox-turbo-protocol:/workspace/packages/protocol/.turbo

      - dukebox-nm-db:/workspace/packages/db/node_modules
      - dukebox-dist-db:/workspace/packages/db/dist
      - dukebox-turbo-db:/workspace/packages/db/.turbo

      - dukebox-nm-sandbox:/workspace/packages/sandbox/node_modules
      - dukebox-dist-sandbox:/workspace/packages/sandbox/dist
      - dukebox-turbo-sandbox:/workspace/packages/sandbox/.turbo

      - dukebox-nm-adapters:/workspace/packages/adapters/node_modules
      - dukebox-dist-adapters:/workspace/packages/adapters/dist
      - dukebox-turbo-adapters:/workspace/packages/adapters/.turbo

      - dukebox-nm-transport:/workspace/packages/transport/node_modules
      - dukebox-dist-transport:/workspace/packages/transport/dist
      - dukebox-turbo-transport:/workspace/packages/transport/.turbo

      - dukebox-nm-desktop:/workspace/apps/desktop/node_modules
      - dukebox-dist-desktop:/workspace/apps/desktop/dist
      - dukebox-turbo-desktop:/workspace/apps/desktop/.turbo
      # Rust build output is large and platform-specific.
      - dukebox-target-desktop:/workspace/apps/desktop/src-tauri/target

      - dukebox-nm-server:/workspace/apps/server/node_modules
      - dukebox-dist-server:/workspace/apps/server/dist
      - dukebox-turbo-server:/workspace/apps/server/.turbo

      # The sandbox tests drive Docker, so this container needs the daemon
      # socket. This is the ONLY container that ever gets it: mounting it into
      # an agent container would hand the agent root on the host.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DUKEBOX_DATABASE_URL: postgres://dukebox:dukebox@postgres:5432/dukebox
      DUKEBOX_REDIS_URL: redis://redis:6379
      CI: 'true'
      # This is an open source project: no usage data leaves the machine.
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  dukebox-node-modules:
  dukebox-pnpm-store:
  dukebox-turbo-cache:

  dukebox-nm-protocol:
  dukebox-dist-protocol:
  dukebox-turbo-protocol:

  dukebox-nm-db:
  dukebox-dist-db:
  dukebox-turbo-db:

  dukebox-nm-sandbox:
  dukebox-dist-sandbox:
  dukebox-turbo-sandbox:

  dukebox-nm-adapters:
  dukebox-dist-adapters:
  dukebox-turbo-adapters:

  dukebox-nm-transport:
  dukebox-dist-transport:
  dukebox-turbo-transport:

  dukebox-nm-desktop:
  dukebox-dist-desktop:
  dukebox-turbo-desktop:
  dukebox-target-desktop:

  dukebox-nm-server:
  dukebox-dist-server:
  dukebox-turbo-server:
